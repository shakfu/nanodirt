<!doctype html>
<meta charset="utf-8">
<title>superdough oracle</title>
<script type="module">
import * as sd from './superdough.js';

// Seeded PRNG so supersaw phases, noise and reverb IRs repeat between runs.
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let registered = false;

// events: [{value, t, duration, cps, cycle}]; returns base64 interleaved stereo float32
window.render = async (events, seconds, sampleRate, seed = 1) => {
  Math.random = mulberry32(seed);
  const ctx = new OfflineAudioContext(2, Math.round(seconds * sampleRate), sampleRate);
  sd.setAudioContext(ctx);
  sd.setSuperdoughAudioController(null);
  await sd.loadWorklets();
  if (!registered) { sd.registerSynthSounds(); registered = true; }
  for (const e of events) {
    await sd.superdough({ ...e.value }, e.t, e.duration, e.cps ?? 0.5, e.cycle ?? 0);
  }
  // Reverb impulse responses are generated by a nested offline render; wait for them.
  const orbits = Object.values(sd.getSuperdoughAudioController().nodes);
  for (let i = 0; i < 500 && orbits.some((o) => o.reverbNode && !o.reverbNode.buffer); i++) {
    await new Promise((r) => setTimeout(r, 10));
  }
  const buf = await ctx.startRendering();
  const [l, r] = [buf.getChannelData(0), buf.getChannelData(1)];
  const out = new Float32Array(l.length * 2);
  for (let i = 0; i < l.length; i++) { out[2 * i] = l[i]; out[2 * i + 1] = r[i]; }
  let s = '';
  const bytes = new Uint8Array(out.buffer);
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
window.ready = true;
</script>
