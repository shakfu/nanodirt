[project]
name = "nanodirt"
version = "0.1.0"
description = "SuperDirt's event model on nanosynth: a Dirt backend for TidalCycles, Strudel and vortex"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }]
requires-python = ">=3.10"
keywords = ["superdirt", "tidalcycles", "strudel", "vortex", "supercollider", "live-coding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
    "nanosynth>=0.5.0",
    "websockets>=13",
]

[project.urls]
Homepage = "https://github.com/shakfu/nanodirt"
Repository = "https://github.com/shakfu/nanodirt"
Issues = "https://github.com/shakfu/nanodirt/issues"
Changelog = "https://github.com/shakfu/nanodirt/blob/main/CHANGELOG.md"

[project.scripts]
nanodirt = "nanodirt.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "numpy>=1.21",
    "pytest>=8",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "twine>=7.0.0",
]

[tool.uv.sources]
nanosynth = { path = "../nanosynth", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanodirt"]

[tool.hatch.build.targets.sdist]
exclude = ["spike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ruff's classic defaults; newer ruff releases enable more rules by default.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true

# SynthDef modules: nanosynth generates UGen rate methods (.ar, .kr) at import
# time and builds graphs from untyped arithmetic, so mypy cannot see them.
[[tool.mypy.overrides]]
module = ["nanodirt.synthdefs", "nanodirt.instruments", "nanodirt.effects", "nanodirt.ugens", "nanodirt.dough"]
disable_error_code = ["attr-defined", "operator", "no-any-return", "arg-type", "union-attr", "call-overload", "misc", "index", "return-value", "assignment", "list-item"]

[[tool.mypy.overrides]]
module = ["vortex", "vortex.*", "link"]
ignore_missing_imports = true
